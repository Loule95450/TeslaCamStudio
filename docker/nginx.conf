server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Written by 10-teslacam-auth.sh at container start: either the basic-auth
    # directives (when AUTH_USER / AUTH_PASSWORD are set) or an empty file.
    include /etc/nginx/teslacam-auth.inc;

    # Serving dashcam footage means large files and a lot of seeking.
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 120s;

    location / {
        try_files $uri $uri/ =404;
    }

    # The app ships inside the image, so a new image is a new app. Without this
    # the browser keeps running the JS it cached before the pull, which looks
    # exactly like the update not working.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # Never serve hidden files out of the mounted volume (.Trashes, ._* , ...).
    # Regex locations win over prefix ones, so this is checked first.
    location ~ /teslacam/\. {
        return 404;
    }

    location = /teslacam {
        return 301 /teslacam/;
    }

    # Decryption sidecar. It holds the Tesla credentials, so they stay on the
    # server: the browser only ever sees a plain MP4. Absent credentials the
    # sidecar is not started and this returns 502, which the app treats as
    # "decryption unavailable".
    location /decrypt/ {
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The Tesla USB drive, bind-mounted read-only by the user.
    #
    # A directory request returns a JSON listing (autoindex_format json), which
    # is what the frontend walks to discover clips; a file request is served
    # normally, with byte-range support so the player can seek.
    location /teslacam/ {
        alias /teslacam/;

        autoindex            on;
        autoindex_format     json;
        autoindex_localtime  off;

        # Clips never change once written, but the listing does.
        add_header Cache-Control "no-cache" always;
    }
}
