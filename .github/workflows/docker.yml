name: Container

# One job, one trigger: every push to main publishes a new image.
#
# Two ways to avoid burning a build:
#
#   1. Put [skip ci] in a commit message. GitHub honours it natively on push
#      and pull_request events, along with [ci skip], [no ci], [skip actions]
#      and [actions skip]. It applies if ANY commit in the push carries it, so
#      it works for a batch of work-in-progress commits.
#   2. Touch only the paths ignored below. Documentation changes cannot alter
#      the image, so they do not rebuild it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '!.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN pushes to GHCR - no secrets to set up

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
